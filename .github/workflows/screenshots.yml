name: Screenshots
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  shots:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|RC' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
          python3 tools/patch_scheme_storekit.py
      - name: Contact sheet
        run: |
          python3 -m venv /tmp/purrpat-venv
          /tmp/purrpat-venv/bin/pip install pillow
          mkdir -p shots
          /tmp/purrpat-venv/bin/python tools/contact_sheet.py shots/coats-contact.png
      - name: Capture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          devices = [x for runtime in json.loads(raw)["devices"].values() for x in runtime if x.get("isAvailable")]
          def exact(name):
              hits = [x for x in devices if x["name"] == name]
              return hits[-1] if hits else None
          big = exact("iPhone 16 Pro Max") or exact("iPhone 17 Pro Max")
          small = exact("iPhone 16") or exact("iPhone 17") or exact("iPhone SE (3rd generation)")
          if big is None:
              names = sorted({x["name"] for x in devices})
              raise SystemExit("no iPhone 16/17 Pro Max for 1320x2868 shots; have: " + ", ".join(names))
          open("/tmp/purrpat-udid", "w").write(big["udid"])
          open("/tmp/purrpat-small-udid", "w").write(small["udid"] if small else "")
          print("6.9-inch " + big["name"], file=sys.stderr)
          if small:
              print("compact " + small["name"], file=sys.stderr)
          PY
          UDID=$(cat /tmp/purrpat-udid)
          echo "simulator $UDID"
          rm -rf /tmp/purrpat-shots
          mkdir -p /tmp/purrpat-shots shots
          xcrun simctl boot "$UDID" || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 || true
          xcodebuild test -project PurrPat.xcodeproj -scheme PurrPatShots -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:PurrPatUITests/ScreenshotTests/testShots \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
          cp -R /tmp/purrpat-shots/. shots/
          python3 tools/check_shot.py shots
          SMALL=$(cat /tmp/purrpat-small-udid)
          if [ -n "$SMALL" ]; then
            APP=$(find DerivedData/Build/Products -name 'PurrPat.app' -type d | head -1)
            xcrun simctl boot "$SMALL" || true
            xcrun simctl install "$SMALL" "$APP"
            xcrun simctl status_bar "$SMALL" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 || true
            mkdir -p shots/compact
            for shot in day coats paywall; do
              perl -e 'alarm 60; exec @ARGV' xcrun simctl terminate "$SMALL" com.limuye.purrpat || true
              perl -e 'alarm 90; exec @ARGV' xcrun simctl launch "$SMALL" com.limuye.purrpat -PurrPatShot "$shot" -PurrPatCPU -AppleLanguages "(en)" -AppleLocale en_US
              ready=0
              for _ in $(seq 1 20); do
                sleep 2
                perl -e 'alarm 20; exec @ARGV' xcrun simctl io "$SMALL" screenshot "shots/compact/en-${shot}.png"
                if python3 tools/check_shot.py "shots/compact/en-${shot}.png" "$shot"; then
                  ready=1
                  break
                fi
              done
              test "$ready" = 1
            done
          fi
          # The stills prove the cat. Record the stroke only after the ginger cat is actually up.
          xcrun simctl boot "$UDID" || true
          for _ in $(seq 1 24); do
            xcrun simctl list devices | grep "$UDID" | grep -q Booted && break
            sleep 5
          done
          xcrun simctl list devices | grep "$UDID" | grep -q Booted
          perl -e 'alarm 60; exec @ARGV' xcrun simctl terminate "$UDID" com.limuye.purrpat || true
          perl -e 'alarm 90; exec @ARGV' xcrun simctl launch "$UDID" com.limuye.purrpat -PurrPatShot stroke -PurrPatCPU -AppleLanguages "(en)" -AppleLocale en_US
          ready=0
          for _ in $(seq 1 15); do
            sleep 2
            perl -e 'alarm 20; exec @ARGV' xcrun simctl io "$UDID" screenshot /tmp/stroke-probe.png
            if python3 tools/check_shot.py /tmp/stroke-probe.png stroke; then
              ready=1
              break
            fi
          done
          test "$ready" = 1
          xcrun simctl io "$UDID" recordVideo --force --codec h264 shots/stroke.mp4 &
          REC=$!
          sleep 8
          kill -INT $REC || true
          for _ in $(seq 1 20); do
            kill -0 $REC 2>/dev/null || break
            sleep 1
          done
          wait $REC || true
          test -s shots/stroke.mp4
          ls -lh shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
