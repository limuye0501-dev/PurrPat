name: Screenshots
on:
  pull_request:
  workflow_dispatch:
jobs:
  shots:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|RC' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project PurrPat.xcodeproj -scheme PurrPat -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -20
          grep -q "BUILD SUCCEEDED" build.log
      - name: Capture
        run: |
          set -uo pipefail
          limited() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for r in d for x in d[r] if x.get("isAvailable") and "iPhone" in x["name"]]
          pro=[x for x in c if "Pro" in x["name"] and "Max" in x["name"]]
          print((pro or c)[-1]["udid"])
          ')
          limited 60 xcrun simctl boot "$UDID" || true
          limited 90 xcrun simctl bootstatus "$UDID" -b || true
          sleep 5
          limited 20 xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          APP=DerivedData/Build/Products/Debug-iphonesimulator/PurrPat.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          launch_shot() {
            local shot="$1"
            local extra="$2"
            local attempt
            limited 15 xcrun simctl terminate "$UDID" com.limuye.purrpat || true
            sleep 1
            for attempt in 1 2 3; do
              if limited 20 xcrun simctl launch "$UDID" com.limuye.purrpat -PurrPatShot "$shot" -PurrPatCPU $extra -AppleLanguages "(en)" -AppleLocale en_US; then
                return 0
              fi
              sleep 3
            done
            return 0
          }
          wait_shot() {
            local out="$1"
            local i bytes
            for i in 1 2 3 4 5 6; do
              sleep 3
              limited 15 xcrun simctl io "$UDID" screenshot "$out" || true
              bytes=$(stat -f%z "$out" 2>/dev/null || echo 0)
              echo "$out attempt $i is $bytes bytes"
              if [ "$bytes" -gt 180000 ]; then
                return 0
              fi
            done
            echo "$out stayed on the launch screen"
            return 0
          }
          for S in day night coats paywall; do
            EXTRA=""
            if [ "$S" = "night" ]; then EXTRA="-PurrPatUnlock"; fi
            launch_shot "$S" "$EXTRA"
            wait_shot "shots/en-$S.png"
          done
          launch_shot stroke ""
          wait_shot shots/stroke-ready.png
          rm -f shots/stroke-ready.png
          limited 20 xcrun simctl io "$UDID" recordVideo --force --codec h264 shots/stroke.mp4 &
          REC=$!
          sleep 7
          kill -INT $REC 2>/dev/null || true
          for _ in 1 2 3 4 5 6 7 8; do
            kill -0 $REC 2>/dev/null || break
            sleep 1
          done
          kill -KILL $REC 2>/dev/null || true
          wait $REC 2>/dev/null || true
          ls -lh shots || true
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
