name: Screenshots
on:
  pull_request:
  workflow_dispatch:
jobs:
  shots:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|RC' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project PurrPat.xcodeproj -scheme PurrPat -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -20
          grep -q "BUILD SUCCEEDED" build.log
      - name: Capture
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for r in d for x in d[r] if x.get("isAvailable") and "iPhone" in x["name"]]
          pro=[x for x in c if "Pro" in x["name"] and "Max" in x["name"]]
          print((pro or c)[-1]["udid"])
          ')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100
          APP=DerivedData/Build/Products/Debug-iphonesimulator/PurrPat.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for spec in "en en_US" "zh-Hans zh_CN"; do
            set -- $spec
            L=$1; loc=$2
            for S in day night coats paywall; do
              xcrun simctl terminate "$UDID" com.limuye.purrpat 2>/dev/null || true
              EXTRA=""
              if [ "$S" = "night" ]; then EXTRA="-PurrPatUnlock"; fi
              xcrun simctl launch "$UDID" com.limuye.purrpat -PurrPatShot "$S" -PurrPatCPU $EXTRA -AppleLanguages "($L)" -AppleLocale "$loc"
              sleep 8
              xcrun simctl io "$UDID" screenshot "shots/${L}-${S}.png"
            done
          done
          xcrun simctl terminate "$UDID" com.limuye.purrpat 2>/dev/null || true
          xcrun simctl io "$UDID" recordVideo --codec h264 --force shots/stroke.mp4 &
          REC=$!
          sleep 1
          xcrun simctl launch "$UDID" com.limuye.purrpat -PurrPatShot stroke -PurrPatCPU -AppleLanguages "(en)" -AppleLocale en_US
          sleep 8
          kill -INT $REC || true
          wait $REC || true
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
