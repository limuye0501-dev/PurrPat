name: TestFlight
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  testflight:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      TEAM_ID: D53V28KTGW
      # App Store Connect app "Purr Pat", bundle com.limuye.purrpat, SKU purrpat.
      ASC_APP_ID: "6838995846"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode_*.app
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -viE "beta|RC" | sort -V | tail -1)
          [ -n "$XC" ] || { echo NO_XCODE_26; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - run: brew install xcodegen && xcodegen generate
      - name: ASC API key
        env:
          P8_B64: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys"
          KP="$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          if printf '%s' "$P8_B64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$P8_B64" > "$KP"
          else
            printf '%s' "$P8_B64" | tr -d '[:space:]' | base64 -D > "$KP" 2>/dev/null || printf '%s' "$P8_B64" | tr -d '[:space:]' | base64 -d > "$KP"
          fi
          if ! openssl pkey -in "$KP" -noout >/dev/null 2>&1; then
            base64 -D < "$KP" > "$KP.once" 2>/dev/null || base64 -d < "$KP" > "$KP.once"
            mv "$KP.once" "$KP"
          fi
          openssl pkey -in "$KP" -noout
          chmod 600 "$KP"
          cp "$KP" "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          echo "ASC_KEY_PATH=$KP" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "api key ready ($(wc -c < "$KP") bytes)"
      - name: Import distribution certificate
        env:
          P12_B64: ${{ secrets.DIST_CERT_P12 }}
          P12_PASS: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/b.keychain-db
          KCP=$(openssl rand -hex 12)
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/d.p12"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security import "$RUNNER_TEMP/d.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
      - name: Ensure bundle id exists
        env:
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 tools/asc_ensure_bundle_id.py ensure || echo "bundle id step skipped"
      - name: Archive (automatic signing)
        env:
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          BUILD=$(( ${{ github.run_number }} + 9 ))
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "version 1.0 build $BUILD app $ASC_APP_ID"
          xcodebuild archive -project PurrPat.xcodeproj -scheme PurrPat -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=$BUILD \
            2>&1 | tee archive.log
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: Export and upload to TestFlight
        env:
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > EO.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist EO.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee export.log
          grep -qE "EXPORT SUCCEEDED|Upload succeeded" export.log
      - name: Internal TestFlight
        env:
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 tools/asc_ensure_bundle_id.py publish
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: "*.log"
