name: PurrPat
options:
  bundleIdPrefix: com.limuye
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant, ja, Base]
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_ID: com.limuye.purrpat
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: D53V28KTGW
    CODE_SIGN_STYLE: Automatic
targets:
  PurrPat:
    type: application
    platform: iOS
    sources:
      - path: PurrPat
        excludes:
          - Info.plist
          - Products.storekit
      - path: PurrPat/Products.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: PurrPat/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        MARKETING_VERSION: $(MARKETING_VERSION)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D53V28KTGW
        ENABLE_PREVIEWS: YES
    scheme:
      storeKitConfiguration: PurrPat/Products.storekit
      testTargets:
        - PurrPatTests
  PurrPatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PurrPatTests]
    dependencies:
      - target: PurrPat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D53V28KTGW
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PurrPat.app/PurrPat"
        BUNDLE_LOADER: "$(TEST_HOST)"
